# EXAMPLE ARTIFACT - invented contents.
#
# Published to show the inventory format and its level scheme. The real
# inventory lives under the private data root and is never committed: filled
# in truthfully it is an itemised public list of its author's skill gaps.
#
# level semantics, in descending coverage:
#   production  1.0  shipped and maintained it in production
#   used        0.8  built real things with it, not owned in production
#   managed     0.4  led people who did it; did not write the code
#   learning    0.2  actively learning, nothing shipped
#   none        0.0  no exposure - kept deliberately, see below
#
# `none` entries are not omissions. An absent id and an id at `none` score
# identically, but the `none` entry states the gap out loud and gives
# inventory.audit somewhere to attach demand it cannot otherwise name.

